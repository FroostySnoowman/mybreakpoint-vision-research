[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakpoint-vision"
version = "0.1.0"
description = "Ball tracking, court keypoint detection and point segmentation for tennis video."
requires-python = ">=3.11"
authors = [{ name = "Jacob Beal" }]
license = { file = "LICENSE" }
dependencies = [
    "torch",
    "numpy",
    "opencv-python",
    "av",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest"]
eval = ["onnxruntime"]

[tool.setuptools.packages.find]
include = ["breakpoint_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
